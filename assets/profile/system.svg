  <text x="58" y="105" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">One profile. Three connected layers.</text>

  <path d="M235 260H965" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="235" cy="260" r="12" fill="#2F81F7"/>
  <circle cx="600" cy="260" r="12" fill="#A371F7"/>
  <circle cx="965" cy="260" r="12" fill="#F85149"/>

