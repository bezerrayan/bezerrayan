  <text x="58" y="470" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">OUTPUT: SECURE DIGITAL PRODUCTS BUILT AROUND REAL OPERATIONAL PROBLEMS.</text>
